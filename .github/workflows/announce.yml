name: Announce a game release

# Reusable workflow, called from a game repository's release workflow once its release is
# published. Sends `game-released` to this repository, which verifies the release and
# opens the registry bump (game-released.yml). Add to the game's release.yml:
#
#   announce:
#     needs: [release]
#     uses: sunsided/games.markusmayer.dev/.github/workflows/announce.yml@announce-v1
#     with:
#       app-id: ${{ vars.GAMES_ANNOUNCE_APP_ID }}
#
# announce-v1 moves with each compatible release; to pin a commit instead, name its exact
# release tag in the comment: `announce.yml@<sha> # announce-v1.1.0` (announce-tag.yml).
#
# The job runs in the caller's `games` environment, so the key lives there as the
# environment secret GAMES_ANNOUNCE_APP_PRIVATE_KEY, limited to release tags (v*). A caller
# job cannot set `environment:` itself, and environment secrets cannot be passed through
# `secrets:`, hence it is set here. Create the environment first: one that does not exist is
# created on the fly without protection. A repository-level key passed as `private-key` is
# still accepted until every game has moved.
#
# The key is the *announce* app's (sunsided-games-announce), not the app that opens and
# auto-merges the registry PR. The announce app has Contents: write and nothing else,
# which is what repository_dispatch needs, and it is installed on this repository only.
# Without Pull requests: write a leaked key cannot open a PR, so it cannot get code past
# the `ci` check into main; it can push stray branches, which deploy nothing (the deploy
# identity is bound to refs/heads/main). The PR app's key lives only in this repository.

on:
  workflow_call:
    inputs:
      app-id:
        description: The announce GitHub App's ID
        type: string
        required: true
      tag:
        description: Release tag (default the caller's ref name)
        type: string
        default: ''
    secrets:
      # Declared so the job may read it; the `games` environment's secret of this name
      # takes its place. Callers do not pass it.
      GAMES_ANNOUNCE_APP_PRIVATE_KEY:
        description: The announce GitHub App's private key, from the `games` environment
        required: false
      private-key:
        description: The announce GitHub App's private key, if not in the `games` environment
        required: false

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    # Resolved in the caller's repository.
    environment:
      name: games
      url: https://games.markusmayer.dev
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.GAMES_ANNOUNCE_APP_PRIVATE_KEY || secrets.private-key }}
          owner: sunsided
          repositories: games.markusmayer.dev
          # Belt and braces: even this token asks for no more than dispatch needs.
          permission-contents: write

      - name: Send game-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -n --arg repo "$REPO" --arg tag "$TAG" \
            '{event_type: "game-released", client_payload: {repo: $repo, tag: $tag}}' |
            gh api repos/sunsided/games.markusmayer.dev/dispatches --input -
          echo "Announced $REPO $TAG to games.markusmayer.dev"
