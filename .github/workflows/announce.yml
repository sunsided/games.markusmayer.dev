name: Announce a game release

# Reusable workflow, called from a game repository's release workflow once its release is
# published. Sends `game-released` to this repository, which verifies the release and
# opens the registry bump (game-released.yml). Add to the game's release.yml:
#
#   announce:
#     needs: [release]
#     uses: sunsided/games.markusmayer.dev/.github/workflows/announce.yml@main
#     with:
#       app-id: ${{ vars.GAMES_APP_ID }}
#     secrets:
#       private-key: ${{ secrets.GAMES_APP_PRIVATE_KEY }}
#
# The token is the games GitHub App's, scoped to this one repository and valid for an
# hour. The game repository holds nothing that can write anywhere else.

on:
  workflow_call:
    inputs:
      app-id:
        description: The games GitHub App's ID
        type: string
        required: true
      tag:
        description: Release tag (default the caller's ref name)
        type: string
        default: ''
    secrets:
      private-key:
        description: The games GitHub App's private key
        required: true

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: sunsided
          repositories: games.markusmayer.dev

      - name: Send game-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -n --arg repo "$REPO" --arg tag "$TAG" \
            '{event_type: "game-released", client_payload: {repo: $repo, tag: $tag}}' |
            gh api repos/sunsided/games.markusmayer.dev/dispatches --input -
          echo "Announced $REPO $TAG to games.markusmayer.dev"
